  test_bars: 1000
  valid_bars: 800
  purge_bars: 30
  embargo_bars: 12
  min_test_bars: 400
  counting_basis: tradable_bars_only
  test_is_most_recent: true
  no_shuffle: true
  test_used_exactly_once: true
  min_test_calendar_days: 365
  min_test_sessions: 200
  rationale: 'Sabit BAR SAYISI (yuzde degil) secildi, cunku varlik gecmisleri 4 kat fark ediyor (BTC 19.9k bar /
    metaller 3.6k). Yuzde (60/20/20) kullanilsaydi metallerin test penceresi ~167 bar = ~28 gun olurdu ve hicbir
    sey soylemezdi. Bedeli: BTC test penceresi kisa kalir (~958 bar = ~159 gun). Bu bedel KABUL EDILDI cunku BTC
    icin asil OOS araci tek bir test penceresi degil, Asama 9''daki WALK-FOLD katlanacak walk-forward analizidir.
    Politika degistirmek istenirse policy_version artirilir ve YENI dosya yazilir; eskisi silinmez.'
hard_rules:
- TEST dönemi hiçbir eğitim, hyperparameter araması veya eşik seçiminde KULLANILMAZ.
- TEST tam olarak BİR KEZ, tüm kararlar dondurulduktan sonra çalıştırılır.
- Hyperparameter araması yalnızca VALID üzerinde yapılır.
- 'Purge ve embargo atlanamaz: label horizon''u kadar bar her sınırda budanır.'
- Örneklem sayımları non_tradable barlar HARİÇ tutularak yapılır.
- Bu dosya değiştikçe frozen_sha256 uyuşmazlığı kontrol edilir; uyuşmazsa kayıt GEÇERSİZ sayılır ve yeniden üretilmesi
  gerekir.
