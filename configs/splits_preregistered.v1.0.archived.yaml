purpose: Bu dosya bir ON-KAYITTIR (pre-registration). Test dönemi, herhangi bir model/indikatory/eşik SONUCU GÖRÜLMEDEN
  sabitlenir. Sonuçlar görüldükten sonra bu dosyayı DEĞİŞTİRMEK tüm OOS iddialarını geçersiz kılar; gerekiyorsa
  policy_version artırılıp YENİ bir dosya yazılır, eskisi silinmez.
