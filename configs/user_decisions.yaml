btc:
  decision: "BTCUSDT SPOT sinyal verisi olarak KALIR"
  instrument: "BTCUSDT"
  venue: "binance_spot"
  mode: "core"
  timeframe: "4h"
  history_years: 9.1
  bars: 19888
  funding_rate:
    role: "cost_and_context_only"   # yalnızca maliyet/bağlam katmanı
    generates_signals: false        # << PERP SİNYALİ ÜRETİLMEZ
