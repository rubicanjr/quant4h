# ============================================================================
# configs/user_decisions.yaml
# Kullanıcı kararlarının KAYNAĞI. Bu dosya insan tarafından onaylanmış
# kararları içerir; kod bu kararları config.py üzerinden uygular.
# Bir karar değişirse ÖNCE bu dosya, SONRA config.py güncellenir.
#
# Onay tarihi : 2026-09-16
# Durum       : Aşama 1 kapanışı (roll/kesinti düzeltmesi bekliyor)
# Kapsam      : Araştırma / backtest / sinyal üretimi. CANLI EMİR YOK.
# ============================================================================

meta:
  decided_on: "2026-09-16"
  purpose: "research_backtest_signal_only"
  live_trading: false
  advisory: false            # sistem yatırım tavsiyesi ÜRETMEZ
  probabilistic_only: true   # tüm çıktılar olasılıksaldır; garanti YOKTUR

# ---------------------------------------------------------------------------
# KARAR 1 — BIST30  (2026-09-16 GÜNCELLENDİ: NETLEŞTİRME)
# ---------------------------------------------------------------------------
# ÖNCEKİ YANLIŞ ANLAMA: "BIST30" = XU030 endeksi sanılmış, watch_only +
# VİOP maliyet proxy'si ile modellenmişti.
# DOĞRUSU (kullanıcı netleştirmesi): BIST30 = **BIST30 KONSTİTUANT HİSSELERİ**.
# XU030 endeksi TRADE VARLIĞI DEĞİLDİR; long'lar için BAĞLAM FİLTRESİ olarak kalır.
bist30:
  decision: "BIST30 = KONSTİTUANT HİSSE SEPETİ (endeks değil)"
  decided_on: "2026-09-16"
  supersedes: "XU030.IS endeksini sinyal motoru sayan önceki karar"
  tradable_unit: "hisse (equity)"
  instrument_type: "stock_basket"
  universe:
    frozen_in: "configs/bist30_universe.yaml"     # AŞAMA 1.5'te oluşturulacak
    freeze_rule: >
      Konstitüant listesi TARİH DAMGASIYLA sabitlenir. Backtest boyunca liste
      DEĞİŞMEZ; aksi hâlde survivorship bias oluşur (bugünün kazananlarıyla
      geçmiş test edilmiş olur). Liste değiştirilirse yeni bir tarih damgalı
      sürüm eklenir, eskisi silinmez.
    survivorship_bias_note: >
      Yahoo'dan yalnızca BUGÜN BIST30'da olan hisseler indirilebilir. Endeksten
      ÇIKAN hisseler (delist/birleşme/endeks düşüşü) serbest veride yoktur.
      Bu nedenle sepet backtest'i SURVIVORSHIP BIAS taşır ve bu bias
      SONUÇLARI YUKARI ÇEKER. Bu, tüm raporlarda zorunlu caveat'tir;
      BIST30 sonuçları BTC/metallerle aynı güven düzeyinde DEĞERLENDİRİLEMEZ.
  xu030_index_role:
    is_tradable: false
    role: "context_filter_for_longs"
    usage: >
      XU030 endeksi yalnızca ÜST ZAMAN DİLİMİ / BAĞLAM filtresi olarak kullanılır
      (ör. endeks EMA200 altında iken hisse long sinyalleri bastırılır).
      Endeks üzerinde POZİSYON AÇILMAZ, endeks getirisi portföy performansına
      YAZILMAZ.
    data_already_downloaded: "data/raw/bist30_1h_raw.parquet + data/interim/bist30_4h.parquet"
    keep_as: "BIST30_CONTEXT (yeniden adlandırılacak, Aşama 1.5)"
  volume_leg_enabled: "BEKLİYOR — hisse verisinde hacim VAR; Aşama 1.5 QC'si hacim kalitesini doğrularsa hacim/onay bacağı hisse bazında AÇILABİLİR"
  execution_assumption:
    model: "BIST_hisse_maliyet_modeli"
    commission_bps: 10.0        # TEK TARAF, tipik aracı kurum (kullanıcı onayına açık)
    spread_bps: 30.0            # TEK TARAF yarım-spread maliyeti (TAM spread 60 bp)
    slippage_bps: 20.0          # TEK TARAF
    one_way_bps: 60.0
    round_trip_bps: 120.0       # << kullanıcının onayladığı hedef; config.py'de assert ile kilitli
    note: >
      Bunlar YAKLAŞIKLAMADIR ve Aşama 1.5'te hisse bazlı likidite ölçümüyle
      kalibre edilecektir. Gerçek aracılık komisyonunuzu biliyorsanız
      configs/user_decisions.yaml içinde güncelleyin — sonuçları doğrudan etkiler.
    previous_viop_proxy: "GEÇERSİZ (endeks için kurulmuştu); hisse sepeti için kullanılmaz"
  mandatory_caveats:
    - "SURVIVORSHIP BIAS: yalnızca bugün endekste olan hisseler indirilebilir; endeksten çıkanlar yok. Sonuçlar yukarı yönlü çarpık olur."
    - "Konstitüant listesi tarih damgasıyla sabitlenmeli; aksi hâlde look-ahead oluşur."
    - "BIST hisse seans 09:30-18:00 Europe/Istanbul (6.5 saat) → 4H'ye tam bölünmez; ince/kısmi barlar kaçınılmazdır."
    - "Yahoo 1h limiti 730 gün → hisse bazlı intraday geçmiş en fazla ~2.4 yıl."
    - "Hisse bazlı kurumsal aksiyonlar (temettü/split/bedelli) Yahoo 'Adj Close' ile düzeltilir; ham fiyat ile adjusted fiyat AYRI tutulmalı, düzeltme asla sessiz uygulanmamalı."
    - "Halt/limit-up/limit-down günleri: BIST'te günlük fiyat marjı sınırlıdır; bu barlar sinyalde kullanılabilir ama gerçekçi execution varsayılamaz."
  stage_1_5_task:
    name: "AŞAMA 1.5 — BIST30 hisse üniversali"
    status: "TAMAMLANDI (2026-09-16)"
    result:
      universe_version: "2026-09-16.v1"
      members: 30
      downloaded: 30
      included_in_basket: 28
      excluded: 2
      excluded_detail:
        DSTKF: "halt/marj bayrağı %10.0 > %5 eşik; 68 sıfır-aralık bar (%5.68) -> 1 QC ERROR"
        TRALT: "605 bar < 800 eşiği; 296 gün < 300 gün eşiği (halka arz yeni, veri 2025-11-24'te başlıyor)"
      median_4h_bars: 2158
      median_missing_pct: 4.60
      median_thin_pct: 33.5
      corporate_action_events: 482
      corporate_action_marked_bars: 298
      split_candidates: 0
      halt_or_limit_bars: 228
      median_avg_daily_turnover_try: 2388000000
      round_trip_cost_bps: 120
      report: "reports/bist30_universe_qc.md"
    key_finding: >
      Yahoo'nun 1h BIST serisinde adjclose == close (%100 ölçüldü): intraday seri
      kurumsal aksiyon düzeltmesi İÇERMİYOR. Tespit bu yüzden GÜNLÜK seriden
      yapılıp ex-date'ler session_date üzerinden 4H barlara taşındı. Politika
      adjust.py felsefesiyle birebir: OTOMATİK DÜZELTME YOK, FLAG ONLY.
    steps:
      - "1. Konstitüant listesini TARİH DAMGASIYLA sabitle -> configs/bist30_universe.yaml (kaynak + erişim tarihi + sürüm no; eski sürümler silinmez)"
      - "2. Hisse başına Yahoo 1h indir (730 gün limiti; rate-limit için retry + sleep; ham katman immutable)"
      - "3. İstanbul lokal grid'inde 4H'ye resample (mevcut seans-takvimi duyarlı resampler; bar_anchor_mode=local)"
      - "4. Hisse bazlı QC tablosu üret: bar sayısı, eksik %, halt/gap bayrağı, kurumsal aksiyon bayrağı (adj/raw sapması), likidite eşiği (ort. günlük TL hacim + ortalama spread proxy)"
      - "5. Likidite eşiğini GEÇEMEYEN hisseleri 'excluded' olarak işaretle (silme), sepeti likit alt kümeyle kur"
      - "6. XU030'u BIST30_CONTEXT olarak yeniden adlandır; bağlam filtresi rolünü kodla"
    acceptance:
      - "Üniversal dosyası tarih damgalı ve sürümlü"
      - "Her hisse için QC satırı var; eşik altındakiler gerekçesiyle işaretli"
      - "Survivorship bias caveat'i raporda AYNEN geçiyor"
      - "XU030 trade varlığı DEĞİL, yalnızca bağlam"

# ---------------------------------------------------------------------------
# KARAR 2 — Altın
# ---------------------------------------------------------------------------
gold:
  decision: "GC=F KALIR + basit roll-gap tespiti/düzeltmesi EKLENİR"
  instrument: "GC=F"                # COMEX ön-ay altın vadeli (Yahoo)
  proxy_for: "XAUUSD"
  mode: "core"
  requires_adjustment: true         # düzeltme uygulanmadan modelleme YASAK (QC RED)
  intraday_history_years: 2.4
  roll_adjustment:
    rule: "gap > eşik × ATR ise ROLL olarak işaretle"
    atr_period: 14
    atr_multiple: 3.0
    action: "getiri serisinde düzelt (backward-adjust), fiyatları SİLME"
    exclude_if_data_outage: true    # boşluğu atlayan getiri ROLL sayılmaz
    preserve_raw: true              # orijinal değerler *_raw kolonlarında kalır
    log_every_mutation: true
  known_issues:
    - "2026-01-30 15:00 → 2026-02-02 18:00 UTC: 75 saatlik veri kesintisi."
    - "2026-01-26..2026-02-06: fiyat 5.626→4.653 (≈ −%17), günlük hacim öncekinin %38'i → feed kalitesi DÜŞÜK."
  grid:
    anchor_local: "18:00"
    anchor_mode: "local"
    session_day_start_local: "17:30"   # 17:00-18:00 NY bakım molası biten seansa ait
    bars_per_session: 6

# ---------------------------------------------------------------------------
# KARAR 3 — Gümüş
# ---------------------------------------------------------------------------
silver:
  decision: "SI=F KALIR + aynı roll düzeltmesi"
  instrument: "SI=F"                # COMEX ön-ay gümüş vadeli (Yahoo)
  proxy_for: "XAGUSD"
  mode: "core"
  requires_adjustment: true
  intraday_history_years: 2.4
  roll_adjustment:
    rule: "gap > eşik × ATR ise ROLL olarak işaretle"
    atr_period: 14
    atr_multiple: 3.0
    action: "getiri serisinde düzelt, fiyatları SİLME"
    exclude_if_data_outage: true
    preserve_raw: true
    log_every_mutation: true
  event_2026_02_02:
    reported_as: "tek bar −%22"
    investigated: true
    verdict: "NE ROLL NE BAD PRINT"
    root_cause: >
      2026-01-30 15:00 UTC → 2026-02-02 18:00 UTC arasında 75 saatlik VERİ
      KESİNTİSİ var (normal hafta sonu 80 bar; burada Pazartesi 00:00-15:00 UTC
      de kayıp) ve 2026-02-02 günü yalnızca 5 bar gelmiş (normal ~23). −%22,
      bu boşluğu ATLAYAN sahte bir getiridir.
    action_taken: "BAR SILINMADI. 'boşluğu atlayan getiri' olarak işaretlendi; getiri/roll/label hesaplarından hariç tutuluyor."
    enforcement: "qc.continuity kontrolü + test_gap_crossing_return_is_not_treated_as_real_return"
  known_issues:
    - "2026-01-26..2026-02-06: fiyat 121.79→66.88 (≈ −%45), günlük hacim öncekinin %42'si → feed kalitesi ÇOK DÜŞÜK."
    - "Aynı kesinti GOLD'da da birebir aynı tarihlerde var → Yahoo kaynaklı ortak sorun."
  grid:
    anchor_local: "18:00"
    anchor_mode: "local"
    session_day_start_local: "17:30"
    bars_per_session: 6

