# ---------------------------------------------------------------------------
# KARAR 5 — Risk profili
# ---------------------------------------------------------------------------
risk:
  default_profile: "balanced"
  profiles_stored_in_config: ["conservative", "balanced", "aggressive"]
  active:
    name: "balanced"
    risk_per_trade: 0.005          # %0.5
    max_daily_loss: 0.02
    max_weekly_loss: 0.05
    max_open_positions: 3
    max_correlation: 0.70          # << GOLD|SILVER = 0.768 BU LİMİTİ AŞIYOR
    max_leverage: 2.0
    max_portfolio_heat: 0.015
    max_consecutive_losses: 4
    loss_streak_risk_multiplier: 0.5
    model_threshold: 0.58          # ML opsiyonel filtreye geçilirse
    min_signal_score: 0.60
    max_gross_exposure: 1.00
    max_exposure_per_asset: 0.40
  presets:
    conservative: {risk_per_trade: 0.0025, max_daily_loss: 0.01,  max_weekly_loss: 0.025, max_open_positions: 2, max_correlation: 0.55, max_leverage: 1.0, model_threshold: 0.62}
    balanced:     {risk_per_trade: 0.005,  max_daily_loss: 0.02,  max_weekly_loss: 0.05,  max_open_positions: 3, max_correlation: 0.70, max_leverage: 2.0, model_threshold: 0.58}
    aggressive:   {risk_per_trade: 0.01,   max_daily_loss: 0.035, max_weekly_loss: 0.08,  max_open_positions: 4, max_correlation: 0.80, max_leverage: 3.0, model_threshold: 0.55}
  correlation_buckets:
    # ONAY: 2026-09-16 — kullanıcı öneriyi kabul etti.
    status: "ONAYLANDI (2026-09-16) — Aşama 8'de uygulanacak"
    rationale: >
      GOLD|SILVER günlük log-getiri korelasyonu +0.768, balanced profilin
      max_correlation=0.70 limitini aşıyor. İkisi bağımsız risk değil, tek bir
      makro riskin (kıymetli maden / reel faiz / USD) iki ifadesidir.
    buckets:
      precious_metals:
        members: ["GOLD", "SILVER"]
        observed_daily_corr: 0.768
        rule: >
          Kova TEK risk birimi sayılır. Kova içi toplam ısı (sum of open risks)
          TEK bir işlemin ısısını aşamaz: bucket_heat <= risk_per_trade.
          Yani GOLD ve SILVER aynı anda, ayrı ayrı %0.5 riskle AÇIK TUTULAMAZ;
          birleşik en fazla %0.5 (balanced) risk taşıyabilir.
        enforcement_point: "risk modülü (Aşama 8) — bucket_heat limiti"
      crypto:
        members: ["BTC"]
        observed_daily_corr: null
        rule: "tek üyeli kova; ısı limiti = risk_per_trade"
      turkey_equity:
        members: ["BIST30"]
        observed_daily_corr: null
        rule: "tek üyeli kova; watch_only olduğu sürece portföy ısısına YAZILMAZ, yalnızca raporlanır"
    cross_bucket_limit:
      rule: "Kovalar ARASI toplam ısı max_portfolio_heat'i aşamaz (balanced: 0.015)"
      note: "Korelasyon limiti kova İÇİNDE aranmaz (kova zaten tek risk); kovalar arası diversifikasyon varsayılır ama max_portfolio_heat ile sınırlanır."
    rejected_alternatives:
      - "İkili arasında yön bazlı netleştirme (cross-hedge) — uygulanmadı: maliyet ve rolü belirsiz"
      - "max_correlation'ı 0.80'e çıkarmak — REDDEDİLDİ: limiti veriye uydurmak overfitting'in bir biçimidir"

# ---------------------------------------------------------------------------
# KARAR 6 — Sepet ağırlıklandırma, sinyal seviyesi, XU030 filtresi (2026-09-16)
# ---------------------------------------------------------------------------
basket_policy:
  weighting:
    decision: "EŞİT-RİSK (equal risk)"
    meaning: >
      Her sinyal AYNI risk bütçesini alır. Sermaye ağırlıklandırması YOKTUR:
      pozisyon büyüklüğü = (risk_per_trade x equity) / stop_mesafesi. Yani
      hisse fiyatı, piyasa değeri veya hacmi pozisyon büyüklüğünü DOĞRUDAN
      belirlemez; yalnızca stop mesafesi üzerinden belirler.
    capital_weighting: false
    liquidity_role: "eligibility_only"   # likidite yalnızca UYGUNLUK şartıdır, ağırlık değil
    liquidity_note: >
      Likidite eşiği Aşama 1.5'te uygulandı (250 mn TL/gün + 250 bin lot/gün).
      Eşiği geçemeyen hisse sepete ALINMAZ ama eşit-risk politikası içinde
      ağırlıklandırma faktörü olarak KULLANILMAZ.
  signal_level:
    decision: "HİSSE BAŞINA (per stock)"
    meaning: >
      Her hisse KENDİ EMA200 + momentum + yapısal kurulumunu bağımsız
      çalıştırır. Sepet düzeyinde TEK bir sinyal ÜRETİLMEZ.
    portfolio_caps_enforced_in: "Aşama 8 (risk modülü)"
    caps: ["maks eşzamanlı pozisyon", "sektör tavanı", "basket ısısı (bucket heat)"]
  split_preregistration:
    decision: "TEK ORTAK TAKVİM PENCERESİ — hisse başına ayrı split YOK"
    file: "configs/splits_preregistered.yaml -> bist30_basket"
    common_window: "2023-10-27 → 2026-09-16"
    grid_bars: 2158
    stocks: 28
    frozen_snapshot: "data/frozen/bist30_basket_4h_frozen.parquet (H17 kuralı: sha256 ile kilitli)"
    purge_embargo: "core varlıklarla AYNI (30 + 12 bar)"
    blocks:
      train: {grid_bars: 678, median_tradable_per_stock: 449, window: "2023-10-27 → 2024-09-24"}
      valid: {grid_bars: 635, median_tradable_per_stock: 421, window: "2024-11-04 → 2025-09-09"}
      test:  {grid_bars: 677, median_tradable_per_stock: 448, window: "2025-10-17 → 2026-09-16", calendar_days: 333}

xu030_context_filter:
  decision: "Aşama 2 içinde KODLANACAK"
  module: "src/quant4h/features/context.py -> longs_allowed()"
  rule: >
    BIST30 hisseleri LONG-ONLY'dir. YENİ bir long sinyali YALNIZCA
    XU030 4H KAPANIŞ > XU030 EMA200 iken açılabilir. XU030 EMA200 altındayken
    sepete YENİ SİNYAL AÇILMAZ; MEVCUT pozisyonlar kendi stoplarıyla yönetilir
    (zorla kapatma YOKTUR).
  directionality:
    bist30_stocks: "LONG-ONLY"
    core_assets: "long + short (BTC / GOLD / SILVER filtresiz)"
  anti_lookahead: >
    Filtre, hisse barının AÇILIŞ anında KAPANMIŞ olan son XU030 barını kullanır
    (bar_open - 4h). Henüz oluşmakta olan XU030 barı ASLA kullanılmaz.
    XU030 EMA200 ısınma döneminde (ilk 200 bar) veya veri yoksa filtre
    FAIL-CLOSED davranır: long'a İZİN VERİLMEZ.
  fail_closed: true
  records: "longs_allowed kolonu + reasons (context_below_ema200 / context_warmup / context_missing)"

# ---------------------------------------------------------------------------
# Sadelik kuralları (kullanıcı kararı, bağlayıcı)
# ---------------------------------------------------------------------------
simplicity_rules:
  max_chart_elements: 3
  allowed_chart_elements: ["candles", "EMA200", "structural_stop_and_target_lines"]
  forbidden_indicators:
    - "ADX"
    - "Hurst exponent"
    - "HMM"
    - "Choppiness Index"
    - "Bollinger Band width"
    - "Ichimoku"
    - "Supertrend"
    - "Keltner Channel"
    - "Order block / supply-demand"
    - "Volume Profile / POC / HVN / LVN"
    - "Anchored VWAP"
    - "Fractal levels"
    - "Stochastic RSI"
    - "MFI"
    - "OBV"
    - "RSI+MACD+BB+Stoch yığını"
  core_logic:
    must_be: "kural tabanlı, kesin ve okunabilir"
    legs:
      trend_filter: "EMA200 yönü (4H) + Daily yön filtresi"
      momentum_confirmation: "ATR-normalize ROC (tek ölçüm)"
      stop: "yapısal seviye (son swing high/low veya Donchian20 kırılımı) + ATR buffer"
      take_profit: "esnek: partial + runner / trailing / time stop"
    regime:
      trend: "EMA200 yönü + EMA20/EMA50 hizası"
      volatility: "ATR yüzdelik dilimi (tek pencere)"
  ml_policy:
    mandatory: false               # << ML ZORUNLU KATMAN DEĞİL
    role: "optional_second_confirmation_filter"
    enabled_by_default: false
    gate: "yalnızca kural tabanlı çekirdeği OUT-OF-SAMPLE'da geçerse devreye girer"
    implementation: "sklearn HistGradientBoosting (LightGBM/XGBoost bu ortamda libgomp eksikliğinden çalışmıyor)"
    validation: "purged K-fold + embargo + walk-forward; test seti yalnızca 1 kez"

# ---------------------------------------------------------------------------
# Çalışma kuralları (kullanıcı kararı, bağlayıcı)
# ---------------------------------------------------------------------------
process_rules:
  - "Her aşamada önce PLAN, sonra UYGULAMA, sonra TEST, sonra DOĞRULAMA."
  - "Tek mesajda devasa kod üretme; dosyaları parça parça yaz, her parça sonrası kısa doğrula."
  - "Her aşama bitince PROGRESS.md'ye 'TAMAMLANDI: <aşama> + 3 satır özet' yaz."
  - "Hata alırsan durma; hatayı 2 satırda özetle, düzelt, devam et."
  - "Bir scripti grep/tail ile filtreleyerek çalıştırma; önce tam çıktı + exit code al (H10 dersi)."
  - "Emin olmadığın yerde varsayım yapma; sor veya alternatifleri listele."
  - "'garantili kazanç', 'risksiz işlem', 'kesin kazandıran sistem' ASLA denmez."
  - "Veri asla sessizce değiştirilmez/silinmez; her mutasyon loglanır."

# ---------------------------------------------------------------------------
# Aşama kapısı
# ---------------------------------------------------------------------------
stage_gate:
  current_stage: "1 (veri kalitesi)"
  queue:
    - id: "1a"
      task: "adjust.py — roll + veri-kesintisi düzeltmesi (KARAR 2 & 3)"
      status: "KOMUT VERİLDİ (2026-09-16)"
    - id: "1b"
      task: "cleaning.py testleri"
      status: "KOMUT VERİLDİ (2026-09-16)"
    - id: "1c"
      task: "split tarihlerini configs/'e ön-kaydet (purge/embargo, varlık bazlı)"
      status: "KOMUT VERİLDİ (2026-09-16)"
