# ---------------------------------------------------------------------------
# ZORUNLU CAVEAT — tüm raporlarda AYNEN basılır
# ---------------------------------------------------------------------------
mandatory_caveats:
  - id: "SURVIVORSHIP_BIAS"
    severity: "KRİTİK"
    text: >
      SURVIVORSHIP BIAS: Serbest kaynaklardan yalnızca BUGÜN (2026-09-16)
      BIST30'da olan hisseler indirilebilir. Geçmişte endekste olup sonradan
      ÇIKAN hisseler (endeksten düşme, birleşme, delist) veri setinde YOKTUR.
      Bu nedenle sepet backtest'i sistematik olarak YUKARI YÖNLÜ ÇARPITILMIŞTIR:
      geçmiş, bugünün kazananlarıyla test edilmektedir. BIST30 sonuçları
      BTC/GOLD/SILVER ile AYNI güven düzeyinde DEĞERLENDİRİLEMEZ.
  - id: "POINT_IN_TIME_MISSING"
    severity: "KRİTİK"
    text: >
      Point-in-time (tarihsel) üyelik verisi YOKTUR. Hangi hissenin hangi
      tarihte endekste olduğu bilinmediği için "o günkü endeks" yeniden
      KURULAMAZ. Uygulanan yaklaşım: sabit bugünkü liste + bu bias'ın açıkça
      raporlanması. Doğru çözüm, tarihsel üyelik verisi olan bir sağlayıcıdır.
  - id: "SOURCE_NOT_OFFICIAL"
    severity: "YÜKSEK"
    text: >
      Liste resmî Borsa İstanbul API'sinden DOĞRULANAMADI (DNS erişilemedi).
      Üç ticari kaynağın oybirliğine dayanır. Üyelik 3 ayda bir değişir;
      bu sürüm 2026-09-16 anına aittir.
  - id: "INTRADAY_LIMIT"
    severity: "YÜKSEK"
    text: >
      Yahoo 1h limiti 730 gün: hisse başına intraday geçmiş EN FAZLA ~2.4 yıl.
      BIST seansı 6.5 saat olduğu için günde yalnızca ~2 adet TAM 4H bar üretilir.
  - id: "HALT_AND_PRICE_LIMITS"
    severity: "ORTA"
    text: >
      BIST'te günlük fiyat marjı sınırlıdır ve devre kesici (halt) uygulanır.
      Marja yapışan barlar sinyalde KULLANILABİLİR ama gerçekçi execution
      VARSAYILAMAZ; bu barlar ayrıca işaretlenir.
  - id: "COST_IS_APPROXIMATE"
    severity: "ORTA"
    text: >
      Hisse maliyet modeli (10 bp komisyon + 30 bp spread + 20 bp slippage ≈
      120 bp gidiş-dönüş) YAKLAŞIKLAMADIR ve kullanıcının gerçek aracılık
      komisyonuyla değiştirilmelidir; sonuçları doğrudan etkiler.

# ---------------------------------------------------------------------------
# Veri indirme / likidite parametreleri (Aşama 1.5 adım 2 ve 4)
# ---------------------------------------------------------------------------
download:
  venue: "yahoo"
  interval: "1h"
  period: "730d"          # Yahoo'nun intraday üst sınırı
  batch_size: 3           # küçük batch: rate-limit dostu
  sleep_between_symbols_s: 3.0
  sleep_between_batches_s: 10.0
  retries: 4
  retry_backoff_s: 20.0
  cache_dir: "data/raw/bist30"
  cache_file_pattern: "{code}_1h_raw.parquet"
  immutable_raw: true

resample:
  target_timeframe: "4h"
  native_session_tz: "Europe/Istanbul"
  bar_anchor_local: "10:00"
  bar_anchor_mode: "local"          # Türkiye'de DST yok -> UTC saatleri yıl boyu sabit
  session_anchor_local: "09:30"
  session_day_start_local: "05:00"
  trading_days: [0, 1, 2, 3, 4]
  drop_partial_last_bar: true       # oluşmakta olan son bar DÜŞÜRÜLÜR
  min_bars_fill: 3                  # >=%75 kapsama; 4 DEĞİL (bkz. thin_bar_policy)
  expected_full_bars_per_session: 2 # 10-14 ve 14-18 lokal = 07/11 UTC
  thin_bar_policy: >
    06:00-10:00 lokal bin'i yalnızca Yahoo'nun 09:30 "açılış anı" printini
    taşır (n_src=1) ve non_tradable olduğu için swing/Donchian anchor'ı
    OLAMAZ. k=3 fraktalın 6 komşusu her zaman en az bir ince bara denk
    geldiğinden, ince bar tutulursa HİÇBİR swing onaylanamaz (ölçüldü: 28
    hissede swing=0, Donchian=0, stop=0 -> sepet hiç sinyal üretemiyordu).
    Bu yüzden ince bar ÜRETİLMEZ. BEDELİ: 09:30-10:00 açılış hareketi 4H
    barlarda temsil edilmez (zaten tek bir print olduğu için bilgi değeri
    düşüktü).

    Eşik 4 DEĞİL 3'tür: ölçüldü ki Yahoo BIST 1h feed'inde 17:30 printi
    günlerin ~%45'inde YOK, yani 14:00-18:00 bin'i çoğu gün 3 kaynak bar
    içerir. min=4 istenirse 323 seans tek bara düşer, "eksik bar" %26.5'e
    çıkar ve TÜM SEPET yanlışlıkla elenir. 3 bar = seansın ≥%75'i ve bu,
    projenin "ince bar" tanımıyla (<%75) birebir tutarlıdır.

quality_gates:
  min_4h_bars: 800                  # altında -> elenir (gerekçesiyle)
  max_missing_fraction: 0.15        # beklenen seans barlarının eksik oranı
  max_thin_fraction: 0.60           # n_src_bars < %75 beklenen olan bar oranı
  max_zero_volume_fraction: 0.05
  max_halt_fraction: 0.05           # marja yapışan / sıfır aralıklı bar oranı
  min_history_days: 300
  max_unexplained_gap_bars: 16      # seans-beklenen boşluk üstü

liquidity:
  metric: "avg_daily_turnover_try"  # ortalama günlük TL hacim (volume x fiyat)
  window_days: 60                   # son 60 seans
  min_avg_daily_turnover_try: 250000000   # 250 milyon TL/gün (2026-09 itibarıyla)
  min_avg_daily_volume_lots: 250000       # yedek eşik: 250 bin lot/gün
  note: >
    Eşikler 2026-09 fiyat/hacim seviyelerine göre seçilmiştir ve MUTLAK
    değildir; enflasyon ve hacim büyümesiyle birlikte gözden geçirilmelidir.
    Eşiği geçemeyen hisse SİLİNMEZ, `excluded` olarak İŞARETLENİR ve gerekçesi
    raporda yazılır.

cost_model:
  applies_to: "BIST30 hisse sepeti (XU030 endeksi DEĞİL)"
  # CostModel birim sözleşmesi: commission ve slippage TEK TARAF;
  # spread_bps TAM kotasyon spread'i (tek tarafa yarısı yazılır).
  commission_bps_per_side: 10.0
  spread_bps_full_quoted: 60.0
  slippage_bps_per_side: 20.0
  one_way_bps: 60.0
  round_trip_bps: 120.0
  user_decisions_notation: >
    configs/user_decisions.yaml içinde "commission 10 + spread 30 + slippage 20"
    biçiminde yazılmıştır; oradaki 30 = TEK TARAF yarım-spread maliyetidir
    (tam spread 60 bp). İki dosya aynı ekonomik varsayımı ifade eder.
  stamp_duty_note: >
    Türkiye'de hisse satışında binde 2 (2 bp) damga vergisi/BSMV benzeri
    yükümlülükler aracı kuruma göre değişir; burada komisyon içine
    YAKLAŞIK olarak dahil edilmiştir, ayrı kalem olarak modellenmemiştir.

corporate_actions_policy:
  auto_adjust: false                # << adjust.py felsefesi: OTOMATİK DÜZELTME YOK
  policy: "FLAG ONLY"
  detection:
    method: "close/adjclose oranındaki adım değişimi + aşırı bitişik getiri"
    split_signal: "oran değişimi VE |log getiri| > 0.25 (ör. 2:1, 3:1, 1:2)"
    dividend_signal: "oran değişimi VE |log getiri| <= 0.25"
  action_on_event:
    - "corporate_action_flag = True"
    - "return_valid = False (oranın değiştiği bar ve sonraki bar)"
    - "non_tradable = True"
    - "close_raw ve adjclose AYRI kolonlarda korunur; hiçbir fiyat YAZILMAZ"
  rationale: >
    Yahoo'nun Adj Close serisi temettü ve bölünmeleri ZATEN düzeltir. Bu
    proje ham fiyatı esas alır ve düzeltmeyi KULLANICIYA bırakır; çünkü
    otomatik düzeltme, düzeltmenin kendisinden kaynaklanan look-ahead riski
    taşır (geçmişe dönük yeniden hesaplama). Bu yüzden yalnızca İŞARETLERİZ.

xu030_context:
  tradable: false
  role: "context_filter_for_longs"
  data: "data/interim/bist30_4h.parquet (XU030.IS, watch_only)"
  usage: >
    XU030 endeksi yalnızca ÜST ZAMAN DİLİMİ / BAĞLAM filtresidir: örneğin
    endeks EMA200 altındayken hisse LONG sinyalleri bastırılır. Endeks
    üzerinde POZİSYON AÇILMAZ ve endeks getirisi portföy performansına
    YAZILMAZ.
